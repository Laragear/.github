name: Bug Report
description: |
  File a bug report to be fixed.

  Sponsors get priority issues, PRs, fixes and requests. Not a sponsor? You're a just click away! https://github.com/sponsors/DarkGhostHunter.
title: "[X.x] What does happen that is considered an error or bug?"
labels: [ "bug" ]
type: "bug"
assignees:
  - DarkGhostHunter
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        The more detailed this bug report is, the faster it can be reviewed and fixed.
  - type: input
    id: version-php-os
    attributes:
      label: PHP & Platform
      description: Exact PHP and Platform (OS) versions using this package.
      placeholder: 8.9.3 - Ubuntu 28.04 x86-64
    validations:
      required: true
  - type: input
    id: version-db
    attributes:
      label: Database
      description: Exact DB version(s) using this package, if applicable. Put "N/A" if not applicable.
      placeholder: MySQL 12.3.28, PostgreSQL 22.4.4
    validations:
      required: false
  - type: input
    id: version-laravel
    attributes:
      label: Laravel version
      description: Exact Laravel version using this package.
      placeholder: 18.2.3
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Reproduction repository (issue will be closed if this is not valid)
      description: The URL of a public GitHub repository which reproduces the problem. **Do not link to your actual project:** link a _minimal_ reproduction as a fresh project without any unnecessary code. **This issue will be automatically closed and not reviewed if this is missing. Please make sure to format the URL starting with `https://github.com` - only repositories hosted on GitHub are accepted.** Try this command for a quick start = `curl -sL https://raw.githubusercontent.com/Laragear/ReplicateIssue/main/create-issue.sh | bash`
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: Expectation
      description: Write what you expect to (correctly) happen.
      placeholder: When I do that, I expect this to happen.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Write what (incorrectly) happens instead.
      placeholder: Instead, when I do that, this happens.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Indicate how to quickly reproduce the bug in the repository you have linked, or a test that fails. If it happens at application boot, leave blank.
      render: php
      placeholder: |
        $test = Laragear::make()->break();
        
        // It should be `true`
        $this->assertFalse($test);
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Stack trace & logs
      description: If you have a **full** stack trace, you can copy it here. You may hide/redact sensible information.
      placeholder: This is automatically formatted into code, no need for ``` backticks.
      render: shell
    validations:
      required: false
