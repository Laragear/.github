name: Publish Artifact to KeyGen

on:
  workflow_call:
    inputs:
      resource_id:
        description: 'The existing Keygen Resource/Product ID'
        required: true
        type: string
    secrets:
      KEYGEN_ACCOUNT_ID:
        description: 'Keygen Account ID'
        required: true
      KEYGEN_PRODUCT_TOKEN:
        description: 'Keygen Product Token'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      KEYGEN_ACCOUNT_ID: ${{ secrets.KEYGEN_ACCOUNT_ID }}
      KEYGEN_PRODUCT_ID: ${{ inputs.resource_id }}
      KEYGEN_PRODUCT_TOKEN: ${{ secrets.KEYGEN_PRODUCT_TOKEN }}
      KEYGEN_VERSION: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      
      - name: Resolve version metadata
        id: meta
        run: |
          # Strip leading "v" for Keygen (it requires bare semver)
          KEYGEN_VERSION=$(echo "$VERSION" | sed 's/^v//')
          echo "keygen_version=${KEYGEN_VERSION}" >> "$GITHUB_OUTPUT"

          MAJOR=$(echo "$KEYGEN_VERSION" | cut -d. -f1)
          echo "major_tag=${MAJOR}.x" >> "$GITHUB_OUTPUT"

          IS_LATEST=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isLatest \
            | jq -r --arg v "$VERSION" '.[] | select(.tagName == $v) | .isLatest')
          echo "is_latest=${IS_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Download release archive via gh CLI
        run: |
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --archive=zip \
            --output=package.zip

      - name: Install Keygen CLI
        run: |
          curl -sSL https://raw.pkg.keygen.sh/keygen/cli/latest/install.sh | sh

      - name: Untag "latest" in Keygen
        if: steps.meta.outputs.is_latest == 'true'
        run: |
          if ! keygen untag \
            --release 'latest' \
            --account "$KEYGEN_ACCOUNT_ID" \
            --product "$KEYGEN_PRODUCT_ID" \
            --token "$KEYGEN_PRODUCT_TOKEN"; then
          echo "Warning: Untag failed (likely no 'latest' tag exists or API mismatch). Proceeding..."
          fi

      - name: Untag major version alias in Keygen (${{ steps.meta.outputs.major_tag }})
        run: |
          MAJOR_TAG="${{ steps.meta.outputs.major_tag }}"
          if ! keygen untag \
            --account "$KEYGEN_ACCOUNT_ID" \
            --product "$KEYGEN_PRODUCT_ID" \
            --token "$KEYGEN_PRODUCT_TOKEN" \
            --release "$MAJOR_TAG"; then
          echo "No release currently tagged '${MAJOR_TAG}' — skipping."
          fi

      - name: Untag major version alias (${{ steps.meta.outputs.major_tag }})
        run: |
          if ! keygen del \
            --account "$KEYGEN_ACCOUNT_ID" \
            --product "$KEYGEN_PRODUCT_ID" \
            --token "$KEYGEN_PRODUCT_TOKEN" \
            --release "${{ steps.meta.outputs.keygen_version }}"; then
          echo "Release '${{ steps.meta.outputs.keygen_version }}' not found in Keygen — skipping delete."
          fi

      - name: Create Keygen release (draft)
        run: |
          keygen new \
            --account "$KEYGEN_ACCOUNT_ID" \
            --product "$KEYGEN_PRODUCT_ID" \
            --token "$KEYGEN_PRODUCT_TOKEN" \
            --version "${{ steps.meta.outputs.keygen_version }}" \
            --channel "Stable"

      - name: Upload artifact to Keygen
        run: |
          keygen upload ./package.zip \
            --account "$KEYGEN_ACCOUNT_ID" \
            --product "$KEYGEN_PRODUCT_ID" \
            --token "$KEYGEN_PRODUCT_TOKEN" \
            --release "${{ steps.meta.outputs.keygen_version }}" \
            --platform "php" \
            --arch "any"

      - name: Publish Keygen release
        run: |
          keygen publish \
            --account "$KEYGEN_ACCOUNT_ID" \
            --product "$KEYGEN_PRODUCT_ID" \
            --token "$KEYGEN_PRODUCT_TOKEN" \
            --release "${{ steps.meta.outputs.keygen_version }}"

      - name: Tag Keygen release as "latest"
        if: steps.meta.outputs.is_latest == 'true'
        run: |
          keygen tag 'latest' \
            --account "$KEYGEN_ACCOUNT_ID" \
            --product "$KEYGEN_PRODUCT_ID" \
            --token "$KEYGEN_PRODUCT_TOKEN" \
            --release "${{ steps.meta.outputs.keygen_version }}"

      - name: Tag Keygen release as major version alias (${{ steps.meta.outputs.major_tag }})
        run: |
          MAJOR_TAG="${{ steps.meta.outputs.major_tag }}"
          keygen tag "$MAJOR_TAG" \
            --account "$KEYGEN_ACCOUNT_ID" \
            --product "$KEYGEN_PRODUCT_ID" \
            --token "$KEYGEN_PRODUCT_TOKEN" \
            --release "${{ steps.meta.outputs.keygen_version }}"